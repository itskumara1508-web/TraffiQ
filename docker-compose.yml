version: '3.8'

services:
  traffiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffiq_vision_engine
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - DASH_USER=admin
      - DASH_PASS=admin123
      - FLASK_PORT=5050
      - API_KEY=trq-prod-live-secret-key-2026
      - DATABASE_PATH=/app/traffiq.db
      - EVIDENCE_DIR=/app/evidence
      - YOLO_CONFIG_DIR=/tmp/ultralytics
      - MPLCONFIGDIR=/tmp/matplotlib
      - CONFIDENCE_THRESHOLD=0.35
      - SPEED_LIMIT_KMH=50.0
      - SIGNAL_MODE=ai_adaptive
    volumes:
      # Persistent SQLite database storage
      - ./traffiq.db:/app/traffiq.db
      # Persistent violation snapshots and video clip archives
      - ./evidence:/app/evidence
      # Optional local video feed mount
      - ./Traffic_Video.mp4:/app/Traffic_Video.mp4:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

